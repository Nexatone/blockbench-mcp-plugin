name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-deploy-${{ github.event.pull_request.number || github.ref }}
  # Finish main deployments; superseded PR checks can be cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun run test

      - name: Build plugin and documentation
        run: |
          bun run build
          bun run docs:build

      - name: Prepare site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          mkdir -p site/nightly
          cp dist/mcp.js dist/about.md dist/icon.svg site/nightly/
          cp docs/api.json docs/index.html docs/style.css site/
          touch site/.nojekyll

      - name: Upload site for deployment
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: site/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: gh-pages

      - uses: actions/download-artifact@v8
        with:
          name: site
          path: .

      - name: Publish site files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- .nojekyll nightly/mcp.js nightly/about.md nightly/icon.svg api.json index.html style.css
          if ! git diff --cached --quiet; then
            git commit -m "deploy: update plugin and documentation"
            git push origin HEAD:gh-pages
          fi

      - name: Build existing Pages site
        env:
          GH_TOKEN: ${{ github.token }}
        # GITHUB_TOKEN pushes do not trigger branch-based Pages builds.
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
